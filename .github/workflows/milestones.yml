name: Auto-assign to single milestone

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Get target milestone ID
        id: get_milestone
        uses: actions/github-script@v7
        with:
          script: |
            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const targetMilestone = milestones.data.find(m => m.title === 'Task');

            if (!targetMilestone) {
              core.setFailed(`Milestone "Task" not found. Please create it first.`);
            }
            return targetMilestone.number;

      - name: Assign milestone
        uses: actions/github-script@v7
        with:
          script: |
            const milestoneNumber = ${{ steps.get_milestone.outputs.result }};
            const payload = context.payload;

            if (payload.issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: payload.issue.number,
                milestone: milestoneNumber
              });
            } else if (payload.pull_request) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: payload.pull_request.number,
                milestone: milestoneNumber
              });
            }